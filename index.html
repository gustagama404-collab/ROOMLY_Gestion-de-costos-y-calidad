<script>
/* ===================== Conexión a Supabase =====================
   Vacío: modo demo en un solo dispositivo (datos en el navegador).
   Con URL y clave: modo multiusuario, cada roommate entra con su correo. */
const SUPABASE_URL='https://rvvggrgdineaxdhcyidl.supabase.co';
const SUPABASE_KEY='sb_publishable_F7ow1xcWPSG_BAMgSAGHUw_g7owfutr';
const CLOUD=!!(SUPABASE_URL&&SUPABASE_KEY);

/* ===================== Lógica de cálculo (funciones puras) ===================== */
const COLORS=['#2E5E4E','#1F4E5F','#8A5A0B','#7A3E62','#3C5A99','#6B6B2F'];
const CAT_FIJO=['Alquiler','Luz','Agua','Internet','Gas'];
const CAT_PUNT=['Limpieza','Cocina','Baño','Otros'];
const ALERTA=0.5, BAJO=0.8;      /* umbrales del semáforo del indicador */
const MIN_APORTE=500;            /* S/ 5.00: monto mínimo para que una compra cuente como aporte */
const DIAS_AVISO=3;              /* días sin pagar para marcar un pago como atrasado */
const MIN_COMPRAS=4;             /* compras del hogar en el mes para activar el semáforo */

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const monthOf=s=>s.slice(0,7);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
const monthName=k=>{const [y,m]=k.split('-').map(Number);return MESES[m-1]+' '+y};
const shiftMonth=(k,n)=>{const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const monthStart=k=>parse(k+'-01');
const monthEnd=k=>{const s=monthStart(k);return new Date(s.getFullYear(),s.getMonth()+1,0)};
const dayDiff=(a,b)=>Math.round((b-a)/86400000);
const fmt=c=>'S/ '+(c/100).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const ddmm=s=>s.slice(8,10)+'/'+s.slice(5,7);
const dmy=s=>s.split('-').reverse().join('/');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const stamp=()=>{const d=new Date();return iso(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};

/* Divide en partes iguales trabajando en céntimos. Los céntimos que sobran los asume quien cobra (tesorero o comprador) */
function splitCents(total,ids,payer){
  const n=ids.length, base=Math.floor(total/n); let rest=total-base*n; const out={};
  if(payer&&ids.includes(payer)){ids.forEach(id=>out[id]=base);out[payer]+=rest;return out}
  ids.forEach(id=>{out[id]=base+(rest>0?1:0); if(rest>0)rest--;});
  return out;
}
/* Convivientes activos en una fecha: ya ingresaron y todavía no salieron */
const isActive=(m,dateStr)=>m.joinedAt<=dateStr&&(!m.leftAt||m.leftAt>=dateStr);
const activeOn=(home,dateStr)=>home.members.filter(m=>isActive(m,dateStr)).map(m=>m.id);
const live=home=>home.expenses.filter(e=>!e.void);
const forAll=(home,e)=>activeOn(home,e.date).every(id=>e.participants.includes(id));
/* Cuenta como aporte: compra puntual vigente, desde S/ 5.00 y dividida entre todos los convivientes activos */
const countsAsAporte=(home,e)=>e.type==='puntual'&&!e.void&&e.amount>=MIN_APORTE&&forAll(home,e);
const whyNoAporte=(home,e)=>e.amount<MIN_APORTE?'No suma al indicador: menor a '+fmt(MIN_APORTE):(!forAll(home,e)?'No suma al indicador: no es para todo el hogar':'');
/* No se anula un gasto con pagos confirmados o avisados */
const canVoid=e=>!Object.keys(e.paid).length&&!Object.keys(e.claims||{}).length;
/* Edita quien registró; si ya salió del hogar, el tesorero de ese mes */
const canEditExp=(home,e,id)=>e.by===id||(!!memberById(home,e.by).leftAt&&home.treasurer[monthOf(e.date)]===id);
function setTreasurer(h,k,to,by){const from=h.treasurer[k]||null;to=to||null;if(from===to)return;if(to)h.treasurer[k]=to;else delete h.treasurer[k];(h.tesLog=h.tesLog||[]).push({by,at:stamp(),month:k,from,to});}

/* Deudas de un gasto. El acreedor queda guardado en el gasto al registrarlo:
   fijo -> tesorero de ese momento; puntual -> quien compró */
function debtsOf(home,e){
  if(e.void||!e.creditor) return [];
  const shares=splitCents(e.amount,e.participants,e.creditor);
  return e.participants.filter(id=>id!==e.creditor).map(id=>({exp:e,from:id,to:e.creditor,cents:shares[id],paid:!!e.paid[id],paidAt:e.paid[id]||null,claimed:(!e.paid[id]&&e.claims&&e.claims[id])||null}));
}
const monthExpenses=(home,k)=>home.expenses.filter(e=>monthOf(e.date)===k).sort((a,b)=>(a.void?1:0)-(b.void?1:0)||b.date.localeCompare(a.date));
const monthDebts=(home,k)=>monthExpenses(home,k).flatMap(e=>debtsOf(home,e));
const allPending=home=>live(home).flatMap(e=>debtsOf(home,e)).filter(d=>!d.paid);

/* Indicador de equidad de aporte: conteo de compras puntuales (desde S/ 5.00), ajustado por días en el hogar */
function equity(home,k,today){
  const start=monthStart(k), endM=(iso(today).slice(0,7)===k)?today:monthEnd(k);
  const rows=home.members.map(m=>{
    const j=parse(m.joinedAt); const s=j>start?j:start;
    let e=endM; if(m.leftAt){const l=parse(m.leftAt); if(l<e)e=l;}
    const days=Math.max(0,dayDiff(s,e)+1);
    const count=new Set(home.expenses.filter(x=>countsAsAporte(home,x)&&x.payer===m.id&&monthOf(x.date)===k).map(x=>x.date)).size;  /* máximo 1 aporte por día */
    return {id:m.id,name:m.name,days,count};
  }).filter(r=>r.days>0);
  const total=rows.reduce((a,r)=>a+r.count,0), totDays=rows.reduce((a,r)=>a+r.days,0);
  rows.forEach(r=>{
    r.expected= total? total*r.days/totDays : 0;
    r.ratio= total? r.count/r.expected : null;
    r.status= r.ratio===null?'neu':(total<MIN_COMPRAS?'few':(r.ratio<ALERTA?'bad':(r.ratio<BAJO?'warn':'ok')));
    r.rate= r.count/r.days;
  });
  const endIso=iso(endM), stay=rows.filter(r=>isActive(memberById(home,r.id),endIso));
  const pool=stay.length?stay:rows, min=Math.min(...pool.map(r=>r.rate));
  const suggest=pool.filter(r=>Math.abs(r.rate-min)<1e-9);   /* si hay empate se sugieren todos los empatados */
  return {rows,total,avg: rows.length? total/rows.length:0,suggest};
}
function balances(home,k){
  const b={}; home.members.forEach(m=>b[m.id]={owes:0,owed:0});
  monthDebts(home,k).forEach(d=>{ if(!d.paid){ b[d.from].owes+=d.cents; b[d.to].owed+=d.cents; } });
  return b;
}
const memberById=(home,id)=>home.members.find(m=>m.id===id)||{name:'?',yape:'-'};
const concept=d=>d.exp.type==='fijo'?('la cuota de '+d.exp.cat.toLowerCase()+' de '+monthName(monthOf(d.exp.date))):('"'+d.exp.desc+'" ('+ddmm(d.exp.date)+')');
const reminderText=(home,d)=>{
  const from=memberById(home,d.from).name, to=memberById(home,d.to);
  return 'Hola '+from+', Roomly te recuerda que tienes un pago pendiente de '+fmt(d.cents)+' a '+to.name+' por '+concept(d)+'.\nPuedes pagar por Yape o Plin al '+to.yape+'.\nMensaje generado automáticamente por Roomly.';
};

/* ===================== Datos de ejemplo ===================== */
function seedDemo(today){
  const M=iso(today).slice(0,7), M1=shiftMonth(M,-1), M2=shiftMonth(M,-2);
  const td=today.getDate();
  const joined=M2+'-01';
  const members=[
    {id:'f',name:'Fernando',pin:'1111',yape:'987 654 321',joinedAt:joined},
    {id:'g',name:'Gustavo',pin:'2222',yape:'976 543 210',joinedAt:joined},
    {id:'d',name:'Dayra',pin:'3333',yape:'965 432 109',joinedAt:joined},
    {id:'m',name:'Mauricio',pin:'4444',yape:'954 321 098',joinedAt:joined},
  ];
  const all=['f','g','d','m'];
  const ex=[];
  const dayIn=(k,day)=>k+'-'+pad(k===M?Math.min(day,td):day);
  const paidAll=(parts,cred,date)=>Object.fromEntries(parts.filter(p=>p!==cred).map(p=>[p,date]));
  const fijos={[M2]:[2400,120,168.30,81.00,41.20],[M1]:[2400,120,172.90,79.20,44.80],[M]:[2400,120,186.40,84.60,46.50]};
  const fDay=[1,3,5,5,6];
  const tes={[M2]:'d',[M1]:'m',[M]:'g'};
  [M2,M1,M].forEach(k=>{
    CAT_FIJO.forEach((c,i)=>{
      const date=dayIn(k,fDay[i]);
      const e={id:uid(),type:'fijo',cat:c,desc:c,amount:Math.round(fijos[k][i]*100),date,payer:null,creditor:tes[k],by:tes[k],participants:all.slice(),paid:{},log:[{by:tes[k],at:date+' 09:00',txt:'Registró el gasto'}]};
      if(k!==M) e.paid=paidAll(all,tes[k],k+'-10');
      ex.push(e);
    });
  });
  const cur=ex.filter(e=>monthOf(e.date)===M);
  const setPaid=(cat,ids)=>{const e=cur.find(x=>x.cat===cat);ids.forEach(i=>e.paid[i]=e.date)};
  cur.find(x=>x.cat==='Luz').claims={m:iso(today)};
  setPaid('Alquiler',['d','m','f']); setPaid('Internet',['d','f','m']); setPaid('Luz',['d']); setPaid('Gas',['m']);
  const fr=f=>Math.max(1,Math.min(td,Math.round(td*f)));
  const used={};  /* si el mes recién empieza, evita que la misma persona tenga dos compras el mismo día */
  const dayFor=(payer,f)=>{const u=used[payer]=used[payer]||new Set();let d=fr(f);
    if(u.has(d))for(let k=1;k<td;k++){if(d-k>=1&&!u.has(d-k)){d-=k;break}if(d+k<=td&&!u.has(d+k)){d+=k;break}}
    u.add(d);return d};
  const P=(payer,desc,cat,amt,f,parts,paid)=>{const date=M+'-'+pad(dayFor(payer,f));ex.push({id:uid(),type:'puntual',cat,desc,amount:Math.round(amt*100),date,payer,creditor:payer,by:payer,participants:parts||all.slice(),paid:Object.fromEntries((paid||[]).map(p=>[p,date])),log:[{by:payer,at:date+' 19:30',txt:'Registró el gasto'}]})};
  P('d','Detergente y lejía','Limpieza',18.90,.10,null,['g','m','f']);
  P('m','Esponjas y lavavajilla','Limpieza',12.40,.20,null,['g','d']);
  P('f','Shampoo y jabón','Baño',24.60,.30,['f','m'],['m']);
  P('f','Lavavajilla','Limpieza',9.90,.40,null,['g']);
  P('d','Papel higiénico x12','Baño',21.50,.45,null,['m']);
  P('m','Bolsas de basura','Limpieza',9.90,.55,null,['d','f']);
  P('g','Ambientador','Baño',8.50,.60,null,['d']);
  P('f','Escoba y recogedor','Limpieza',14.90,.70,null,[]);
  P('d','Aceite y sal','Cocina',15.80,.85,null,[]);
  P('m','Arroz 5 kg','Cocina',22.50,.92,null,[]);
  const items=[['Detergente','Limpieza',17.50],['Papel higiénico x12','Baño',21.00],['Lavavajilla','Limpieza',8.90],['Aceite','Cocina',12.60],['Bolsas de basura','Limpieza',9.50],['Azúcar y café','Cocina',19.80],['Jabón líquido','Baño',11.40],['Lejía','Limpieza',6.90],['Arroz 5 kg','Cocina',21.90],['Esponjas','Limpieza',5.50]];
  const plan={[M1]:{g:3,d:2,m:3,f:2},[M2]:{g:2,d:3,m:2,f:3}};
  let n=0;
  [M2,M1].forEach(k=>{Object.entries(plan[k]).forEach(([p,c])=>{for(let i=0;i<c;i++){const it=items[n%items.length];n++;const date=k+'-'+pad(2+((n*3)%26));
    ex.push({id:uid(),type:'puntual',cat:it[1],desc:it[0],amount:Math.round(it[2]*100),date,payer:p,creditor:p,by:p,participants:all.slice(),paid:paidAll(all,p,date),log:[{by:p,at:date+' 19:30',txt:'Registró el gasto'}]});}})});
  return {code:'RMLY26',name:'Depa Monterrico',demo:true,seededFor:M,members,treasurer:tes,expenses:ex,manual:{},tesLog:[]};
}

async function saveBook(X,wb,filename){
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  let dl=null; try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}
  if(dl){
    try{await dl.save({filename,data:blob});toast('Archivo listo');return}
    catch(e){const c=e&&e.code; if(c==='declined')return toast('Descarga cancelada'); if(c==='rate_limited')return toast('Espera un momento e inténtalo de nuevo');
      if(!['unavailable','not_granted','capability_disabled','capability_removed'].includes(c))return toast('No se pudo descargar el archivo');}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Archivo descargado');
}

function addMemberTo(h,{name,pin,yape,joinedAt}){
  name=(name||'').trim(); yape=(yape||'').trim();
  if(!name)return {ok:false,err:'Escribe el nombre.'};
  if(h.members.some(x=>x.name.toLowerCase()===name.toLowerCase()))return {ok:false,err:'Ya hay un conviviente con ese nombre.'};
  if(!CLOUD&&!/^\d{4}$/.test(pin||''))return {ok:false,err:'El PIN debe tener 4 números.'};
  if(!/^[\d ]{6,15}$/.test(yape))return {ok:false,err:'Escribe un número de Yape o Plin válido.'};
  if(!joinedAt)return {ok:false,err:'Indica la fecha de ingreso.'};
  h.members.push(CLOUD?{id:uid(),name,yape,joinedAt,leftAt:null,userId:null}:{id:uid(),name,pin,yape,joinedAt}); return {ok:true};
}
function voidExpense(h,id,by){const e=h.expenses.find(x=>x.id===id);if(!canVoid(e))return false;e.void={by,at:stamp()};(e.log=e.log||[]).push({by,at:stamp(),txt:'Anuló el gasto'+(e.by!==by?' como tesorero':'')});return true}

function openForm(editId){
  const h=home(), m=me();
  const e=editId?h.expenses.find(x=>x.id===editId):null;
  const locked=e&&!canVoid(e);
  const asTes=e&&e.by!==m.id?' como tesorero':'';   /* con pagos confirmados solo se edita la descripción y la categoría */
  const st={type:e?e.type:'puntual'};
  const draw=()=>{
    const cats=st.type==='fijo'?CAT_FIJO:CAT_PUNT;
    const dateVal=e?e.date:(st.date||iso(today));
    const act=activeOn(h,dateVal);
    const parts=e?e.participants:act;
    document.getElementById('sheet').innerHTML='<div class="sheet-bg" data-a="closeSheet"><form class="sheet wrap" id="expForm" novalidate>'+
     '<div class="row"><h2>'+(e?'Editar gasto':'Registrar gasto')+'</h2><button type="button" class="btn ghost" data-a="closeSheet" aria-label="Cerrar">✕</button></div>'+
     (e?'':'<div class="seg" role="group" aria-label="Tipo de gasto"><button type="button" data-t="puntual" aria-pressed="'+(st.type==='puntual')+'">Compra puntual</button><button type="button" data-t="fijo" aria-pressed="'+(st.type==='fijo')+'">Gasto fijo</button></div>')+
     (locked?'<div class="alert info small">Este gasto ya tiene pagos confirmados o avisados. Para no descuadrar esos pagos, solo puedes cambiar la descripción y la categoría. Si el monto está mal, anúlalo y regístralo de nuevo.</div>':'<p class="small muted">'+(st.type==='fijo'?'Se divide en partes iguales entre todos los convivientes activos. Cada uno paga su cuota al tesorero del mes.':'Lo compraste tú: los demás te deben su parte. Suma a tu indicador si es para todos y cuesta '+fmt(MIN_APORTE)+' o más (máximo una compra por día).')+'</p>')+
     '<div class="field"><label for="fCat">Categoría</label><select id="fCat">'+cats.map(c=>'<option'+(e&&e.cat===c?' selected':'')+'>'+c+'</option>').join('')+'</select></div>'+
     (st.type==='puntual'?'<div class="field"><label for="fDesc">¿Qué compraste?</label><input id="fDesc" maxlength="40" placeholder="Ej.: detergente y lejía" value="'+esc(e?e.desc:'')+'"></div>':'')+
     '<div class="field"><label for="fAmt">Monto (S/)</label><input id="fAmt" inputmode="decimal" placeholder="0.00" value="'+(e?(e.amount/100).toFixed(2):esc(st.amt||''))+'"'+(locked?' disabled':'')+'></div>'+
     '<div class="field"><label for="fDate">Fecha</label><input id="fDate" type="date" value="'+dateVal+'" max="'+iso(today)+'" min="'+MIN_FREE+'-01"'+(locked||e?' disabled':'')+'></div>'+
     (st.type==='fijo'&&!e?'<div class="field" id="tesField"></div>':'')+
     (st.type==='puntual'?'<div class="field"><label>¿Entre quiénes se divide?</label><div class="checks">'+h.members.filter(x=>act.includes(x.id)).map(x=>'<label><input type="checkbox" name="part" value="'+x.id+'"'+(parts.includes(x.id)?' checked':'')+((x.id===(e?e.payer:m.id))||locked?' disabled':'')+'> '+esc(x.name)+(x.id===m.id?' (tú)':'')+'</label>').join('')+'</div><span class="small muted">Por defecto, entre todos. Desmarca a quien no usa lo que compraste.</span></div>':'')+
     '<span class="err" id="fErr" role="alert"></span><button class="btn block" type="submit">'+(e?'Guardar cambios':'Guardar gasto')+'</button></form></div>';
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const a=document.getElementById('fAmt'),d=document.getElementById('fDate');st.amt=a.value;st.date=d.value;st.type=b.dataset.t;draw()});
    const f=document.getElementById('expForm');
    /* gasto fijo: si el mes no tiene tesorero, se elige en el mismo formulario */
    const tesUpd=()=>{const box=document.getElementById('tesField');if(!box)return;const k=monthOf(document.getElementById('fDate').value||iso(today));
      if(!h.treasurer[k]&&!isAdmin()){box.innerHTML='<div class="alert bad small">'+monthName(k)+' todavía no tiene tesorero. Pídele a '+esc(adminName(h))+' (administrador) que lo asigne en Ajustes.</div>';return}
      box.innerHTML=h.treasurer[k]?'<span class="small muted">Cobra el tesorero de '+monthName(k)+': <b>'+esc(memberById(h,h.treasurer[k]).name)+'</b>.</span>':'<label for="fTes">Tesorero de '+monthName(k)+' (obligatorio)</label><select id="fTes"><option value="">Elige al tesorero</option>'+h.members.filter(x=>activeOn(h,k+'-01').includes(x.id)||isActive(x,iso(today))).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select><span class="small muted">El hogar todavía no registra tesorero para ese mes.</span>';};
    tesUpd(); document.getElementById('fDate').addEventListener('change',tesUpd);
    f.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',()=>document.getElementById('fErr').textContent=''));
    f.onsubmit=ev=>{ev.preventDefault();
      if(isOffline())return document.getElementById('fErr').textContent='Sin conexión: conéctate a internet para guardar el gasto.';
      const err=t=>document.getElementById('fErr').textContent=t;
      const cat=document.getElementById('fCat').value;
      const descEl=document.getElementById('fDesc'); const desc=descEl?descEl.value.trim():cat;
      if(st.type==='puntual'&&!desc)return err('Escribe brevemente qué compraste.');
      if(locked){e.cat=cat;e.desc=desc;e.log.push({by:m.id,at:stamp(),txt:'Editó la descripción'+asTes});save();closeSheet();render();toast('Cambios guardados');return}
      const raw=document.getElementById('fAmt').value.replace(',','.').trim();
      if(!/^\d+(\.\d{1,2})?$/.test(raw)||Number(raw)<=0)return err('Escribe un monto mayor a 0, con hasta 2 decimales.');
      if(Number(raw)>99999)return err('El monto es demasiado alto para un gasto del hogar.');
      const amount=Math.round(Number(raw)*100);
      const date=e?e.date:document.getElementById('fDate').value; if(!date||date>iso(today))return err('Elige una fecha de hoy o anterior.');
      if(date<MIN_FREE+'-01')return err('Solo puedes registrar gastos del mes actual o del anterior.');
      if(st.type==='puntual'){
        const payer=e?e.payer:m.id;
        const ps=[payer,...[...f.querySelectorAll('input[name=part]:checked')].map(i=>i.value).filter(v=>v!==payer)];
        if(ps.length<2)return err('Elige al menos a otra persona para dividir el gasto.');
        if(e){Object.assign(e,{cat,desc,amount,participants:ps});e.log.push({by:m.id,at:stamp(),txt:'Editó el gasto'+asTes});}
        else h.expenses.push({id:uid(),type:'puntual',cat,desc,amount,date,payer,creditor:payer,by:m.id,participants:ps,paid:{},log:[{by:m.id,at:stamp(),txt:'Registró el gasto'}]});
      }else{
        if(e){Object.assign(e,{cat,desc:cat,amount});e.log.push({by:m.id,at:stamp(),txt:'Editó el gasto'+asTes});}
        else{
          const k=monthOf(date);
          const dup=h.expenses.find(x=>x.type==='fijo'&&!x.void&&x.cat===cat&&monthOf(x.date)===k);
          if(dup)return err('Ya hay un gasto fijo de '+cat+' en '+monthName(k)+' ('+fmt(dup.amount)+'). Si el monto está mal, edítalo o anúlalo desde Gastos.');
          if(!h.treasurer[k]&&!isAdmin())return err(monthName(k)+' no tiene tesorero. Pídele a '+adminName(h)+' que lo asigne.');
          if(!h.treasurer[k]){const t=document.getElementById('fTes');if(!t||!t.value)return err('Elige al tesorero de '+monthName(k)+' antes de guardar.');setTreasurer(h,k,t.value,m.id);}
          const ps=activeOn(h,date); if(ps.length<2)return err('Se necesitan al menos 2 convivientes activos en esa fecha.');
          if(!ps.includes(h.treasurer[k]))return err('El tesorero de ese mes no vive en el hogar en esa fecha. Cámbialo en Ajustes.');
          h.expenses.push({id:uid(),type:'fijo',cat,desc:cat,amount,date,payer:null,creditor:h.treasurer[k],by:m.id,participants:ps,paid:{},log:[{by:m.id,at:stamp(),txt:'Registró el gasto'}]});
        }
      }
      save(); closeSheet(); ui.month=monthOf(date); render(); toast(e?'Cambios guardados':'Gasto registrado');
    };
    setTimeout(()=>{const x=document.getElementById(st.type==='puntual'?'fDesc':'fAmt');x&&!x.disabled&&x.focus()},50);
  };
  draw();
}

function errText(e){
  const m=String(e&&(e.message||e.error_description||e)||'');
  if(/Invalid login/i.test(m))return 'Correo o contraseña incorrectos.';
  if(/already (been )?registered/i.test(m))return 'Ese correo ya tiene cuenta. Entra con tu contraseña.';
  if(/not confirmed/i.test(m))return 'Primero confirma tu correo con el enlace que te enviamos.';
  if(/provider is not enabled|Unsupported provider|validation_failed/i.test(m))return 'El ingreso con Google todavía no está activado. Avísale a quien administra Roomly.';
  if(/at least 6|Password should/i.test(m))return 'La contraseña debe tener al menos 6 caracteres.';
  if(/rate limit|too many/i.test(m))return 'Se enviaron demasiados correos. Espera unos minutos y vuelve a intentar.';
  if(/only request this after|security purposes/i.test(m))return 'Espera un minuto antes de pedir otro enlace.';
  if(/not authorized/i.test(m))return 'El servidor de correos todavía no puede enviar a ese correo. Avísale a quien administra Roomly.';
  if(/should be different|same_password/i.test(m))return 'La nueva contraseña debe ser distinta a la anterior.';
  if(/expired|invalid/i.test(m)&&/link|token|otp/i.test(m))return 'El enlace venció o ya se usó. Pide uno nuevo.';
  if(/fetch|network|Failed to/i.test(m))return 'Sin conexión. Revisa tu internet.';
  return m||'Ocurrió un error. Inténtalo de nuevo.';
}
const toastErr=e=>toast(errText(e));
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
const brand='<div class="brand-hero"><div class="logo">Roomly</div><p class="muted">Cuentas claras y turnos justos entre roommates.</p></div>';

async function cloudBoot(){
  $app.innerHTML='<div class="login wrap">'+brand+'<p class="muted">Cargando…</p></div>';
  try{
    if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js');
    const H=decodeURIComponent((location.hash||'').replace(/\+/g,' '));
    cs.recovering=/type=recovery/.test(H);
    const herr=/error_description=([^&]+)/.exec(H);
    if(herr){cs.msg=errText(herr[1]);if(!/enlace/.test(cs.msg))cs.msg='El enlace venció o ya se usó. Pide uno nuevo.';history.replaceState(null,'',location.pathname+location.search)}
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const {data}=await sb.auth.getSession();
    cs.user=data.session?data.session.user:null;
  }catch(e){$app.innerHTML='<div class="login wrap">'+brand+'<div class="alert bad"><b>No se pudo conectar con Roomly.</b><span class="small">Revisa tu internet y vuelve a cargar la página.</span></div></div>';return}
  /* no se llama a Supabase dentro del aviso de sesión: se deja para el siguiente ciclo */
  sb.auth.onAuthStateChange((ev,session)=>{const u=session?session.user:null;
    if(ev==='PASSWORD_RECOVERY'&&u){cs.user=u;cs.recovering=true;setTimeout(showNewPass,0);return}
    if((u&&u.id)!==(cs.user&&cs.user.id)){cs.user=u;setTimeout(afterAuth,0)}});
  if(cs.recovering&&cs.user)showNewPass();else await afterAuth();
}
const AUTH_GOOGLE=true;   /* true: se entra con Google; false: correo y contraseña */

function bindProfile(formId,errId,done){
  const f=document.getElementById(formId);
  f.onsubmit=async ev=>{ev.preventDefault();
    const name=document.getElementById('pName').value.trim().replace(/\s+/g,' '), yape=document.getElementById('pYape').value.trim(), err=t=>document.getElementById(errId).textContent=t;
    if(!name)return err('Escribe tu nombre.');
    if(!/^[\d ]{6,15}$/.test(yape))return err('Escribe un número de Yape o Plin válido.');
    const ok=document.getElementById('pOk');
    if(ok&&!ok.checked)return err('Para usar Roomly tienes que aceptar el aviso de privacidad.');

    const upd={roomly_name:name,roomly_yape:yape}; if(ok)upd.roomly_consent={version:1,at:new Date().toISOString()};

/* ---- lectura del hogar ---- */
async function fetchHome(code){
  const [hr,mr,er,rq]=await Promise.all([
    sb.from('homes').select('code,name,demo,treasurer,tes_log,manual,owner').eq('code',code).maybeSingle(),
    sb.from('members').select('id,user_id,name,yape,joined_at,left_at').eq('home_code',code),
    sb.from('expenses').select('id,data,rev').eq('home_code',code),
    sb.from('join_requests').select('user_id,member_id,name,yape,email,created_at').eq('home_code',code)]);
  const err=hr.error||mr.error||er.error; if(err)throw err;
  if(!hr.data)return null;
  const r=hr.data, revs={};
  er.data.forEach(x=>revs[x.id]=x.rev);
  const h={code:r.code,name:r.name,demo:r.demo,owner:r.owner||null,requests:rq.error?[]:(rq.data||[]),treasurer:r.treasurer||{},tesLog:r.tes_log||[],manual:r.manual||{},
    members:mr.data.map(m=>({id:m.id,name:m.name,yape:m.yape,joinedAt:m.joined_at,leftAt:m.left_at||null,userId:m.user_id||null}))
      .sort((a,b)=>a.joinedAt.localeCompare(b.joinedAt)||a.name.localeCompare(b.name)),
    expenses:er.data.map(x=>Object.assign({},x.data,{id:x.id}))};
  return {h,revs};
}
const homeFields=h=>clone({name:h.name,treasurer:h.treasurer||{},tesLog:h.tesLog||[],manual:h.manual||{}});
const memberRow=m=>({name:m.name,yape:m.yape,joined_at:m.joinedAt,left_at:m.leftAt||null});
function snap(h,revs){cs.base={home:homeFields(h),members:Object.fromEntries(h.members.map(m=>[m.id,memberRow(m)])),exp:Object.fromEntries(h.expenses.map(e=>[e.id,{json:JSON.stringify(e),rev:revs[e.id]||1}]))}}
async function openHome(code){
  try{
    const r=await fetchHome(code);
    const mine=r&&r.h.members.find(m=>m.userId===cs.user.id);
    if(!mine){lsSet(LAST,null);await listMyHomes();cs.view='homes';renderCloud();return}
    store={homes:{[code]:r.h},session:{code,memberId:mine.id}};snap(r.h,r.revs);lsSet(LAST,code);
    ui.tab='inicio';ui.month=CUR;ui.filter='todos';subscribe(code);render();maybeGuide();
  }catch(e){toastErr(e);cs.view='homes';renderCloud()}
}

/* ---- tiempo real: cualquier cambio de otro celular vuelve a leer el hogar ---- */
function subscribe(code){
  if(cs.chan)sb.removeChannel(cs.chan);
  const on=()=>scheduleRefresh();
  cs.chan=sb.channel('roomly-'+code)
    .on('postgres_changes',{event:'*',schema:'public',table:'expenses',filter:'home_code=eq.'+code},on)
    .on('postgres_changes',{event:'*',schema:'public',table:'members',filter:'home_code=eq.'+code},on)
    .on('postgres_changes',{event:'*',schema:'public',table:'homes',filter:'code=eq.'+code},on)
    .on('postgres_changes',{event:'*',schema:'public',table:'join_requests',filter:'home_code=eq.'+code},on)
    .subscribe();
}
let refreshT=null;
function scheduleRefresh(){clearTimeout(refreshT);refreshT=setTimeout(refresh,250)}
async function refresh(){
  const h=home(); if(!CLOUD||!h||!cs.user)return;
  await syncChain; if(dirty){if(!cs.netFail)scheduleRefresh();return}
  try{
    const r=await fetchHome(h.code); if(dirty||home()!==h)return;
    if(!r)return afterAuth();
    const mine=r.h.members.find(m=>m.userId===cs.user.id); if(!mine)return afterAuth();
    /* se actualiza en el mismo objeto para no perder lo que esté abierto en pantalla */
    Object.assign(h,{owner:r.h.owner,requests:r.h.requests,name:r.h.name,demo:r.h.demo,treasurer:r.h.treasurer,tesLog:r.h.tesLog,manual:r.h.manual});
    const mm=new Map(h.members.map(m=>[m.id,m])); h.members=r.h.members.map(m=>mm.has(m.id)?fill(mm.get(m.id),m):m);
    const em=new Map(h.expenses.map(e=>[e.id,e])); h.expenses=r.h.expenses.map(e=>em.has(e.id)?fill(em.get(e.id),e):e);
    store.session.memberId=mine.id; snap(h,r.revs); if(cs.netFail){cs.netFail=false;netBar()} softRender();
  }catch(e){}
}
const typing=()=>{const a=document.activeElement;return a&&$app.contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)};
function softRender(){if(typing()){cs.pending=true;return}render()}
document.addEventListener('focusout',()=>{if(cs.pending)setTimeout(()=>{if(cs.pending&&!typing()){cs.pending=false;render()}},0)});
document.addEventListener('visibilitychange',()=>{if(CLOUD&&!document.hidden&&home())scheduleRefresh()});
setInterval(()=>{if(CLOUD&&!document.hidden&&home())refresh()},30000);

/* ---- guardado: solo se envía lo que cambió; si otra persona cambió lo mismo, se combinan ---- */
function mergeMap(b,l,r){b=b||{};l=l||{};const o=Object.assign({},r||{});new Set([...Object.keys(b),...Object.keys(l)]).forEach(k=>{if(!same(l[k],b[k])){if(l[k]===undefined)delete o[k];else o[k]=l[k]}});return o}
function merge3(b,l,r){
  const o=Object.assign({},r);
  new Set([...Object.keys(b),...Object.keys(l)]).forEach(k=>{
    if(k==='paid'||k==='claims')o[k]=mergeMap(b[k],l[k],r[k]);
    else if(k==='log')o.log=(r.log||[]).concat((l.log||[]).slice((b.log||[]).length));
    else if(!same(l[k],b[k])){if(l[k]===undefined)delete o[k];else o[k]=l[k]}
  });
  return o;
}
let syncChain=Promise.resolve(), dirty=false;
function cloudSave(){dirty=true;syncChain=syncChain.then(doSync).catch(e=>{
  if(/fetch|network|Failed to/i.test(String(e&&e.message||e))){dirty=true;cs.netFail=true;netBar();toast('Sin conexión: el cambio se guardará cuando vuelva el internet.');return}
  toast('No se pudo guardar el último cambio. '+errText(e));
  scheduleRefresh()})}
const isOffline=()=>CLOUD&&(navigator.onLine===false||!!cs.netFail);
function netBar(){
  if(!CLOUD)return;
  let b=document.getElementById('netbar');
  if(!b){b=document.createElement('div');b.id='netbar';b.setAttribute('role','status');b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:60;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;background:var(--danger);color:#fff;font-size:13px;font-weight:600;text-align:center';document.body.appendChild(b)}
  b.textContent=dirty?'Sin conexión: tu último cambio se enviará cuando vuelva el internet. No cierres la app.':'Sin conexión: no se pueden registrar cambios hasta que vuelva el internet.';
  b.hidden=!isOffline();
}
addEventListener('online',()=>{cs.netFail=false;netBar();if(!home())return;if(dirty)cloudSave();else scheduleRefresh()});
setInterval(()=>{if(CLOUD&&cs.netFail&&dirty&&navigator.onLine!==false&&home()){cs.netFail=false;netBar();cloudSave()}},15000);
addEventListener('offline',netBar);
async function doSync(){
  if(!dirty)return; dirty=false;
  const h=home(); if(!h||!cs.base)return;
  const code=h.code, B=cs.base; let changed=false; const t0=performance.now(); let wrote=false;
  const hl=homeFields(h);
  if(!same(hl,B.home)){
    const {data:r,error}=await sb.from('homes').select('name,treasurer,tes_log,manual').eq('code',code).single(); if(error)throw error;
    const rem={name:r.name,treasurer:r.treasurer||{},tesLog:r.tes_log||[],manual:r.manual||{}};
    const mg={name:hl.name!==B.home.name?hl.name:rem.name,treasurer:mergeMap(B.home.treasurer,hl.treasurer,rem.treasurer),
      tesLog:rem.tesLog.concat(hl.tesLog.slice(B.home.tesLog.length)),manual:mergeMap(B.home.manual,hl.manual,rem.manual)};
    const {error:e2}=await sb.from('homes').update({name:mg.name,treasurer:mg.treasurer,tes_log:mg.tesLog,manual:mg.manual}).eq('code',code); if(e2)throw e2;
    if(same(homeFields(h),hl)){if(!same(mg,hl)){Object.assign(h,clone(mg));changed=true}B.home=clone(mg)}else B.home=hl;
  }
  for(const m of h.members){
    const row=memberRow(m), b=B.members[m.id];
    if(!b){const {error}=await sb.from('members').insert(Object.assign({home_code:code,id:m.id},row));if(error)throw error}
    else{const diff={};Object.keys(row).forEach(k=>{if(row[k]!==b[k])diff[k]=row[k]});
      if(Object.keys(diff).length){const {error}=await sb.from('members').update(diff).eq('home_code',code).eq('id',m.id);if(error)throw error}}
    B.members[m.id]=row;
  }
  for(const e of h.expenses){
    const b=B.exp[e.id], json=JSON.stringify(e);
    if(!b){const {error}=await sb.from('expenses').insert({home_code:code,id:e.id,data:e});if(error)throw error;B.exp[e.id]={json,rev:1};continue}
    if(b.json===json)continue;
    const base=JSON.parse(b.json), local=JSON.parse(json);
    let rev=b.rev, remote=b.remote||base;
    for(let i=0;;i++){
      const mg=merge3(base,local,remote);
      const {data,error}=await sb.from('expenses').update({data:mg,rev:rev+1,updated_at:new Date().toISOString()}).eq('home_code',code).eq('id',e.id).eq('rev',rev).select('rev');
      if(error)throw error;
      if(data.length){
        if(JSON.stringify(e)===json){if(!same(mg,local)){fill(e,mg);changed=true}B.exp[e.id]={json:JSON.stringify(mg),rev:rev+1}}
        else B.exp[e.id]={json,rev:rev+1,remote:mg};   /* hubo otro cambio mientras se guardaba: se envía en la siguiente vuelta */
        break;
      }
      if(i>=3)throw new Error('Otra persona está cambiando este gasto. Inténtalo otra vez.');
      const {data:r,error:e3}=await sb.from('expenses').select('data,rev').eq('home_code',code).eq('id',e.id).single(); if(e3)throw e3;
      remote=r.data; rev=r.rev;
    }
  }
  wrote=true; (cs.syncTimes=cs.syncTimes||[]).push(performance.now()-t0); if(cs.syncTimes.length>10)cs.syncTimes.shift();
  if(cs.netFail){cs.netFail=false;netBar()}
  if(changed)softRender();
}

     '<div class="field"><label for="cHome">Nombre del hogar</label><input id="cHome" maxlength="30" placeholder="Ej.: Depa Surco"></div>'+
     '<label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cDemo"> Cargar datos de ejemplo (demo para la sustentación)</label>'+
     '<div id="cRealBox" class="small muted">Entrarás como <b>'+esc(profName())+'</b> (Yape '+esc(profYape())+').</div>'+
     '<div id="cDemoBox" style="display:none;flex-direction:column;gap:10px"><div class="field"><label for="cWho">¿Quién eres en el ejemplo?</label><select id="cWho"><option value="f">Fernando</option><option value="g" selected>Gustavo</option><option value="d">Dayra</option><option value="m">Mauricio</option></select></div><span class="small muted">Se crean 3 meses de gastos de ejemplo. Los demás entran con el código y eligen su nombre.</span></div>'+
     '<span class="err" id="cErr" role="alert"></span><button class="btn block" type="submit">Crear hogar</button></form>';
  }
  $app.innerHTML=html+'</div>';
  if(V==='profile')bindProfile('profForm','prErr',()=>afterAuth());
  if(V==='newpass')bindPassForm('npForm','npErr',()=>{cs.recovering=false;toast('Contraseña actualizada');afterAuth()});
  const ff=document.getElementById('forgotForm');
  if(ff)ff.onsubmit=async ev=>{ev.preventDefault();
    const email=document.getElementById('fEmail').value.trim(), err=t=>document.getElementById('fErrM').textContent=t;
    if(!/^\S+@\S+\.\S+$/.test(email))return err('Escribe un correo válido.');
    cs.email=email; const b=ff.querySelector('button[type=submit]'); b.disabled=true;
    try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;
      cs.view='auth';cs.authMode='login';cs.msg='';cs.info='Listo. Si ese correo tiene una cuenta, en unos minutos te llegará un enlace (revisa también Spam). Ábrelo en este mismo celular.';renderCloud();
    }catch(e){b.disabled=false;err(errText(e))}
  };
  const busy=(f,on)=>{const b=f.querySelector('button[type=submit]');if(b){b.disabled=on;b.style.opacity=on?.6:1}};
  const af=document.getElementById('authForm');
  if(af)af.onsubmit=async ev=>{ev.preventDefault();
    const email=document.getElementById('aEmail').value.trim(), pass=document.getElementById('aPass').value, err=t=>document.getElementById('aErr').textContent=t;
    cs.email=email; cs.info='';
    if(!/^\S+@\S+\.\S+$/.test(email))return err('Escribe un correo válido.');
    if(pass.length<6)return err('La contraseña debe tener al menos 6 caracteres.');
    busy(af,true);
    try{
      if(cs.authMode==='signup'){
        const {data,error}=await sb.auth.signUp({email,password:pass}); if(error)throw error;
        if(!data.session){cs.authMode='login';cs.msg='';cs.info='Te enviamos un correo para confirmar tu cuenta. Ábrelo y luego entra aquí.';renderCloud();return}
      }else{const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error)throw error}
      cs.msg='';
    }catch(e){busy(af,false);err(errText(e))}
  };
  const jf=document.getElementById('joinForm');
  if(jf)jf.onsubmit=async ev=>{ev.preventDefault();
    const code=document.getElementById('jCode').value.trim().toUpperCase(), err=t=>document.getElementById('jErr').textContent=t;
    if(!/^[A-Z0-9]{4,8}$/.test(code))return err('Escribe el código del hogar.');
    busy(jf,true);
    try{const {data,error}=await sb.rpc('home_preview',{p_code:code}); if(error)throw error;
      if(!data){busy(jf,false);return err('No encontramos un hogar con ese código.')}
      if(data.is_member)return openHome(data.code);
      if(data.pending)return showWaiting({code:data.code,name:data.name,admin:data.admin});
      cs.preview=data; cs.view='join'; renderCloud();
    }catch(e){busy(jf,false);err(errText(e))}
  };
  const who=document.getElementById('jWho');

  const cf=document.getElementById('claimForm');
  if(cf)cf.onsubmit=async ev=>{ev.preventDefault();
    const err=t=>document.getElementById('jErr2').textContent=t, id=who.value||null;
    busy(cf,true);
    try{const {data:st,error}=await sb.rpc('join_home',{p_code:cs.preview.code,p_member_id:id,p_name:id?null:profName(),p_yape:profYape(),p_joined:iso(today)}); if(error)throw error;
      if(st==='active'){await listMyHomes();await openHome(cs.preview.code);return}
      lsSet(LAST,cs.preview.code); showWaiting({code:cs.preview.code,name:cs.preview.name,admin:cs.preview.admin});
    }catch(e){busy(cf,false);err(errText(e))}
  };
  const demo=document.getElementById('cDemo');
  if(demo)demo.onchange=()=>{document.getElementById('cRealBox').style.display=demo.checked?'none':'flex';document.getElementById('cDemoBox').style.display=demo.checked?'flex':'none';const n=document.getElementById('cHome');if(demo.checked&&!n.value)n.value='Depa Monterrico'};
  const crf=document.getElementById('cForm');
  if(crf)crf.onsubmit=async ev=>{ev.preventDefault();
    const v=id=>document.getElementById(id).value.trim(), err=t=>document.getElementById('cErr').textContent=t;
    const hname=v('cHome'); if(!hname)return err('Ponle un nombre al hogar.');
    let p;
    if(demo.checked){const s=seedDemo(today);
      const me_=v('cWho');
      p={home:{name:hname,demo:true,treasurer:s.treasurer,tesLog:[]},members:s.members.map(({pin,...m})=>m.id===me_?Object.assign(m,{yape:profYape()||m.yape}):m),expenses:s.expenses,me:me_};
    }else{const name=profName(), yape=profYape();
      const id=uid();
      p={home:{name:hname,demo:false,treasurer:{[CUR]:id},tesLog:[{by:id,at:stamp(),month:CUR,from:null,to:id}]},members:[{id,name,yape,joinedAt:iso(today)}],expenses:[],me:id};
    }
    busy(crf,true);
    try{
      for(let i=0;i<5;i++){
        p.home.code=genCode();
        const {error}=await sb.rpc('create_home',{p_home:p.home,p_members:p.members,p_expenses:p.expenses,p_me:p.me});
        if(!error){await listMyHomes();await openHome(p.home.code);if(!demo.checked){ui.tab='ajustes';render()}toast('Hogar creado. Código: '+p.home.code);return}
        if(!/CODIGO_USADO/.test(error.message))throw error;
      }
      throw new Error('No se pudo generar un código. Inténtalo de nuevo.');
    }catch(e){busy(crf,false);err(errText(e))}
  };
}

const passFields=()=>'<div class="field"><label for="np1">Nueva contraseña (mínimo 6 caracteres)</label><input id="np1" type="password" autocomplete="new-password"></div><div class="field"><label for="np2">Repite la contraseña</label><input id="np2" type="password" autocomplete="new-password"></div>';
function bindPassForm(formId,errId,done){
  const f=document.getElementById(formId);
  f.onsubmit=async ev=>{ev.preventDefault();
    const p1=document.getElementById('np1').value, p2=document.getElementById('np2').value, err=t=>document.getElementById(errId).textContent=t;
    if(p1.length<6)return err('La contraseña debe tener al menos 6 caracteres.');
    if(p1!==p2)return err('Las dos contraseñas no coinciden.');
    const b=f.querySelector('button[type=submit]');b.disabled=true;
    try{const {error}=await sb.auth.updateUser({password:p1});if(error)throw error;done()}catch(e){b.disabled=false;err(errText(e))}
  };
  setTimeout(()=>{const x=document.getElementById('np1');x&&x.focus()},50);
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]'); if(!t)return;
  const a=t.dataset.a, h=home(), m=me();
  if(t.tagName==='A')ev.preventDefault();
  if(WRITE_ACTIONS.has(a)&&isOffline()){toast('Sin conexión. Conéctate a internet para guardar cambios.');return}
  if(a==='closeSheet'){if(ev.target===t||t.tagName==='BUTTON')closeSheet();return}
  if(t.tagName==='SELECT'||t.tagName==='DETAILS')return;
  if(a==='tab'){ui.tab=t.dataset.v;render();window.scrollTo(0,0)}
  else if(a==='prev'){ui.month=shiftMonth(ui.month,-1);render()}
  else if(a==='next'){if(ui.month<CUR){ui.month=shiftMonth(ui.month,1);render()}}
  else if(a==='goCur'){ui.month=CUR;render()}
  else if(a==='filter'){ui.filter=t.dataset.v;render()}
  else if(a==='new'){openForm()}
  else if(a==='edit'){openForm(t.dataset.e)}
  else if(a==='askVoid'){const e=h.expenses.find(x=>x.id===t.dataset.e);if(!canVoid(e))return toast('Primero desmarca los pagos de este gasto');confirmSheet('¿Seguro que quieres anular este gasto?','"'+esc(e.type==='fijo'?e.cat:e.desc)+'" por '+fmt(e.amount)+' dejará de contar en el balance y en el indicador. Quedará en el historial como anulado por ti.','Sí, anular','doVoid','data-e="'+e.id+'"')}
  else if(a==='doVoid'){const ok=voidExpense(h,t.dataset.e,m.id);save();closeSheet();render();toast(ok?'Gasto anulado':'Tiene pagos registrados: no se puede anular')}
  else if(a==='claim'){const e=h.expenses.find(x=>x.id===t.dataset.e);e.claims=e.claims||{};e.claims[m.id]=iso(today);e.log.push({by:m.id,at:stamp(),txt:'Avisó que pagó su parte'});save();render();toast('Listo. '+memberById(h,e.creditor).name+' debe confirmarlo')}
  else if(a==='reject'){const e=h.expenses.find(x=>x.id===t.dataset.e);const u=t.dataset.u;if(e.claims)delete e.claims[u];e.log.push({by:m.id,at:stamp(),txt:'Indicó que no recibió el pago de '+memberById(h,u).name});ui.open=u;save();render();toast('Marcado como no recibido')}
  else if(a==='copy'){copy(t.dataset.v)}
  else if(a==='copyRem'){copy(document.getElementById('remText').textContent)}
  else if(a==='remind'){openReminder(t.dataset.u)}
  else if(a==='pay'||a==='toggle'){const e=h.expenses.find(x=>x.id===t.dataset.e);const u=t.dataset.u;if(e.paid[u]){delete e.paid[u];e.log.push({by:m.id,at:stamp(),txt:'Marcó pendiente el pago de '+memberById(h,u).name})}else{e.paid[u]=iso(today);if(e.claims)delete e.claims[u];e.log.push({by:m.id,at:stamp(),txt:'Confirmó el pago de '+memberById(h,u).name})}ui.open=u;save();render();toast(e.paid[u]?'Pago confirmado':'Marcado como pendiente')}
  else if(CLOUD&&a==='switch'){openAccount()}
  else if(CLOUD&&(a==='logout'||a==='cLogout')){cloudLogout()}
  else if(a==='cHomes'){cloudGoHomes()}
  else if(a==='privacy'){openPrivacy()}
  else if(a==='guide'){openGuide(Number(t.dataset.v)||0)}
  else if(a==='guideEnd'){closeSheet()}
  else if(a==='cWaitOpen'){const x=cs.homes.find(y=>y.code===t.dataset.v);showWaiting({code:x.code,name:x.name})}
  else if(a==='cWaitCheck'){checkWaiting(true)}
  else if(a==='cCancelReq'){cancelRequest()}
  else if(a==='approveReq'){adminRpc('approve_request',{p_code:h.code,p_user:t.dataset.u,p_joined:iso(today)},'Solicitud aprobada')}
  else if(a==='askRejectReq'){const r=h.requests.find(x=>x.user_id===t.dataset.u);confirmSheet('¿Rechazar la solicitud de '+esc(r.name)+'?','No podrá ver nada del hogar. Si fue un error, puede volver a pedir unirse con el código.','Sí, rechazar','doRejectReq','data-u="'+esc(r.user_id)+'"')}
  else if(a==='doRejectReq'){closeSheet();adminRpc('reject_request',{p_code:h.code,p_user:t.dataset.u},'Solicitud rechazada')}
  else if(a==='askMakeAdmin'){const x=memberById(h,t.dataset.u);confirmSheet('¿Hacer administrador a '+esc(x.name)+'?','Podrá aprobar solicitudes, cambiar al tesorero y registrar salidas. Tú dejarás de ser administrador.','Sí, cambiar','doMakeAdmin','data-u="'+esc(x.id)+'"')}
  else if(a==='doMakeAdmin'){closeSheet();adminRpc('transfer_admin',{p_code:h.code,p_member_id:t.dataset.u},'Administrador actualizado')}
  else if(a==='askLeaveHome'){const others=h.members.some(x=>x.userId&&x.userId!==cs.user.id);
    if(isAdmin()&&others)return confirmSheet('Primero nombra a otro administrador','Eres el administrador de '+esc(h.name)+'. Antes de salir, elige en Convivientes a otra persona y toca «Hacer administrador».','Entendido','closeSheet','');
    confirmSheet('¿Salir de '+esc(h.name)+'?',isAdmin()?'Nadie más usa este hogar: al salir se borrará completo, con todos sus gastos. No se puede deshacer.':'Dejarás de ver este hogar. Tu nombre seguirá en los gastos que ya existen para que las cuentas de los demás no se descuadren. Si debes algo, sigue pendiente.','Sí, salir','doLeaveHome','')}
  else if(a==='doLeaveHome'){closeSheet();leaveThisHome()}
  else if(a==='askDelete'){confirmSheet('¿Eliminar tu cuenta y tus datos?','Se borran tu cuenta, tu nombre, tu correo y tu número de Yape de todos tus hogares. Los montos de los gastos se mantienen como «Ex conviviente» para no descuadrar las cuentas de los demás. Si eres administrador, el rol pasa a otro conviviente; si nadie más usa el hogar, se borra completo. No se puede deshacer.','Sí, eliminar todo','doDelete','')}
  else if(a==='doDelete'){closeSheet();deleteAccount()}
  else if(a==='cGoogle'){googleLogin(t)}
  else if(a==='cProfile'){if(home())openProfile();else{cs.view='profile';renderCloud()}}
  else if(a==='cForgot'){cs.email=(document.getElementById('aEmail')||{}).value||cs.email;cs.view='forgot';cs.msg='';cs.info='';renderCloud()}
  else if(a==='cBackAuth'){cs.view='auth';renderCloud()}
  else if(a==='cChangePass'){openChangePass()}
  else if(a==='cAuthMode'){cs.authMode=cs.authMode==='signup'?'login':'signup';cs.msg='';cs.info='';renderCloud()}
  else if(a==='cOpen'){openHome(t.dataset.v)}
  else if(a==='cCreate'){cs.view='create';renderCloud()}
  else if(a==='cBack'){cs.view='homes';renderCloud()}
  else if(a==='switch'||a==='logout'){const code=store.session.code;store.session=null;save();ui.login={code,step:'pin'};render()}
  else if(a==='saveYape'){const v=document.getElementById('yape').value.trim();if(!/^[\d ]{6,15}$/.test(v)){document.getElementById('yapeErr').textContent='Escribe un número válido.';return}m.yape=v;save();toast('Número guardado')}
  else if(a==='addMember'){const g=id=>document.getElementById(id).value;const r=addMemberTo(h,{name:g('nmName'),pin:CLOUD?'':g('nmPin'),yape:g('nmYape'),joinedAt:g('nmDate')});if(!r.ok){document.getElementById('nmErr').textContent=r.err;return}save();render();toast('Conviviente agregado')}
  else if(a==='askLeave'){const u=t.dataset.u;const x=memberById(h,u);document.getElementById('leave-'+u).innerHTML='<div class="alert info"><b>Registrar la salida de '+esc(x.name)+'</b><div class="field"><label for="lvDate-'+u+'">Último día en el hogar</label><input id="lvDate-'+u+'" type="date" value="'+iso(today)+'" min="'+x.joinedAt+'"></div><span class="small muted">Desde el día siguiente no participa en gastos nuevos y el indicador solo cuenta sus días en el hogar. Sus deudas pendientes se mantienen.</span><span class="err" id="lvErr-'+u+'"></span><div style="display:flex;gap:8px"><button class="btn danger sm" data-a="doLeave" data-u="'+u+'">Confirmar salida</button><button class="btn sec sm" data-a="tab" data-v="ajustes">Cancelar</button></div></div>'}
  else if(a==='doLeave'){const u=t.dataset.u;const d=document.getElementById('lvDate-'+u).value;const x=memberById(h,u);if(!d||d<x.joinedAt){document.getElementById('lvErr-'+u).textContent='Elige una fecha posterior a su ingreso.';return}if(h.members.filter(y=>!y.leftAt&&y.id!==u).length<1){document.getElementById('lvErr-'+u).textContent='El hogar debe quedar con al menos un conviviente.';return}x.leftAt=d;save();render();toast('Salida registrada')}
  else if(a==='askReset'){confirmSheet('¿Seguro que quieres restablecer el hogar de ejemplo?','Se borran los gastos, pagos y cambios hechos en este hogar'+(CLOUD?' para todos los convivientes':'')+' y vuelve a los datos iniciales de la demo, con fechas del mes actual. El registro de pruebas manuales se conserva. No se puede deshacer.','Sí, restablecer','doReset','')}
  else if(a==='doReset'&&CLOUD){closeSheet();cloudResetDemo().catch(toastErr)}
  else if(a==='doReset'){const keep=(store.homes.RMLY26||{}).manual||{};store.homes.RMLY26=seedDemo(today);store.homes.RMLY26.manual=keep;save();closeSheet();ui.month=CUR;ui.tab='inicio';render();toast('Datos de ejemplo restablecidos')}
  else if(a==='runTests'){t.textContent='Ejecutando...';t.disabled=true;runTests().then(()=>{ui.tab='pruebas';render()})}
  else if(a==='xlsPruebas'||a==='xlsMes'){const lbl=t.textContent;t.disabled=true;t.textContent='Preparando archivo...';
    (a==='xlsMes'?exportMes():exportPruebas()).catch(e=>toast(e&&e.message==='load'?'No se pudo cargar el generador de Excel. Revisa tu conexión.':'No se pudo generar el archivo')).finally(()=>{const b=document.querySelector('[data-a="'+a+'"]');if(b){b.disabled=false;b.textContent=lbl}})}
  else if(a==='manual'){const c=t.dataset.c;h.manual=h.manual||{};h.manual[c]={status:t.dataset.v,obs:document.getElementById('obs-'+c).value.trim(),by:m.id,at:stamp()};save();render();toast('Prueba registrada')}
  else if(a==='create'){ui.login={step:'create'};renderLogin()}
  else if(a==='loginBack'){ui.login={step:'code',code:''};renderLogin()}
});
document.addEventListener('change',ev=>{
  const h=home();
  if(ev.target.id==='tesMonth'){let v=ev.target.value||CUR;if(v<MIN_FREE)v=MIN_FREE;if(v>shiftMonth(CUR,1))v=shiftMonth(CUR,1);ui.tesMonth=v;render()}
  else if(ev.target.id==='tes'&&(!isAdmin()||isOffline())){toast(isOffline()?'Sin conexión.':'Solo el administrador puede cambiar el tesorero.');render()}
  else if(ev.target.id==='tes'){const k=ui.tesMonth||CUR;setTreasurer(h,k,ev.target.value,me().id);save();render();toast('Tesorero de '+monthName(k)+' actualizado')}
});
document.addEventListener('toggle',ev=>{const d=ev.target;if(d.classList&&d.classList.contains('grp')){ui.open=d.open?d.dataset.g:(ui.open===d.dataset.g?null:ui.open)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
if(CLOUD)cloudBoot();else render();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script></body></html>
